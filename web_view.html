<div class="sync-form-container">
    <h3>Выгрузка данных в БД</h3>
    
    <div class="form-group">
        <label for="sheetUrl">Ссылка на Google Таблицу:</label>
        <input type="text" id="sheetUrl" placeholder="https://docs.google.com/spreadsheets/d/1A2B.../edit" required>
        <small class="hint">Вставьте полную ссылку из адресной строки браузера</small>
    </div>

    <div class="form-group">
        <label for="sheetName">Имя листа:</label>
        <input type="text" id="sheetName" placeholder="Например: Продажи_Январь" required>
        <small class="hint">Точное имя вкладки внизу таблицы</small>
    </div>

    <button id="syncButton" class="btn-primary">
        <span class="btn-text">Запустить выгрузку</span>
        <span class="btn-loader" style="display:none;">⏳ Загружаем...</span>
    </button>

    <div id="resultMessage" class="result-msg"></div>
</div>
